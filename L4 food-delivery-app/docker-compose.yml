services:

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - food-delivery-app
    networks:
      - app-network
    restart: unless-stopped
    
#  Food Delivery Application Service
  food-delivery-app:
    build: ./backend/.
    ports:
    - "5000:5000"
    networks:
      - app-network
    environment:
      - MYSQL_HOST=mysql-db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=food_delivery
      - MONGO_URL=mongodb://mongo-db:27017/food_delivery
      - PORT=5000
    depends_on:
      mysql-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads
    restart: unless-stopped


  mysql-db:
    image: mysql:8.0
    ports:
    - "3306:3306"
    networks:
      - app-network
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=food_delivery
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql-schema.sql:/docker-entrypoint-initdb.d/mysql-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-db:
    image: mongo:7
    ports:
      - "27017:27017"
    networks:
      - app-network
    environment:
      - MONGO_INITDB_DATABASE=food_delivery
    volumes:
      - mongo-data:/data/db
      - ./database/mongo-data.js:/docker-entrypoint-initdb.d/mongo-data.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped



# Volume for Application Uploads
volumes:
  app_uploads:
  mysql-data:
  mongo-data:


# Network Definition
networks:
  app-network:
    driver: bridge