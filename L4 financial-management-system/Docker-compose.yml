version: '3.8'

services:
  # Frontend Service
  frontend:
    image: nginx:latest
    ports:
      - "80:80"
    networks:
      - fms-network
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped

  # Backend Service
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@mysql/financial_db
      - MONGO_URL=mongodb://mongodb:27017/financial_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=f1n4nc14l-m4n4g3m3nt-s3cr3t-k3y-2024
      - JWT_SECRET_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTUxNjIzOTAyMn0.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30
      - FLASK_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
    networks:
      - fms-network
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - financial_uploads:/app/uploads
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: financial_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql-schema.sql:/docker-entrypoint-initdb.d/mysql-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fms-network
    restart: unless-stopped

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo-data.js:/docker-entrypoint-initdb.d/mongo-data.js:ro
    networks:
      - fms-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - fms-network
    restart: unless-stopped

networks:
  fms-network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  financial_uploads: