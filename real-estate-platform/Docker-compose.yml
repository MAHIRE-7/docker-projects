services:
  # Backend Service
  realestate-frontend:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    networks:
      - real-estate-platform-network
    depends_on:
      - real-estate-backend
    restart: unless-stopped
    
  real-estate-backend:
    build: ./backend/.
    ports:
      - "3000:3000"
    networks:
      - real-estate-platform-network
    environment:
      - MYSQL_HOST=realestate-db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=real_estate
      - MONGO_URL=mongodb://mongodb:27017/realestate
      - JWT_SECRET=2b84386ddd93ce883c9840bdde157cf6
      - PORT=3000
    depends_on:
      realestate-db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped
  
  # Database Service Mysql
  realestate-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: real_estate
  
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/mysql-schema.sql:/docker-entrypoint-initdb.d/mysql-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - real-estate-platform-network
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo-data.js:/docker-entrypoint-initdb.d/mongo-data.js:ro
    networks:
      - real-estate-platform-network
    restart: unless-stopped

# networks and volumes
networks:
  real-estate-platform-network:
    driver: bridge

volumes:
  backend_uploads:
  db_data:
  mongo_data: